<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Coordinate axes -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- Unit Circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#circleGrad)" stroke-width="12"/>

  <!-- Radius Vector (45 deg) -->
  <line x1="256" y1="256" x2="355" y2="157" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Sin projection (vertical, blue) -->
  <line x1="355" y1="256" x2="355" y2="157" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>

  <!-- Cos projection (horizontal, emerald) -->
  <line x1="256" y1="256" x2="355" y2="256" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>

  <!-- Point P -->
  <circle cx="355" cy="157" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="4"/>

  <!-- Label 'sin' / 'cos' -->
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="4">TRYGONOMETRIA</text>
</svg>
